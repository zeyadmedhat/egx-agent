# The website: after every EGX close, download prices, scan, and publish the encrypted site to GitHub Pages.
# Secrets (Settings → Secrets and variables → Actions): SITE_PASSWORD (required), TELEGRAM_TOKEN (optional: the
# bot that messages each friend who pressed Connect Telegram) and OWNER_TELEGRAM (optional: your Telegram @username,
# so the alarms reach you when something breaks), WORKER_URL and WORKER_KEY (optional: the Cloudflare Worker that
# answers the bot at once, worker/bot.js). The logs are public, so the job only prints counts.
# The data is kept in GitHub's cache between runs and backed up once a day (locked; see app/backup.py).
name: Daily scan and website

on:
  schedule:                     # UTC. EGX closes 14:30 Cairo (UTC+3 in summer, UTC+2 in winter); prices are
    - cron: "50 12 * * 0-4"     # usually there an hour later. The later runs catch late prices; a run with
    - cron: "55 13 * * 0-4"     # nothing new only rebuilds the site.
    - cron: "20 16 * * 0-4"
    - cron: "20 19 * * 0-4"
    - cron: "40 */3 * * *"      # every 3 hours, every day: connects friends who pressed Start in Telegram
  workflow_dispatch:            # "Run workflow": the Run scan button on the site opens this page for the owner
    inputs:
      force_scan:
        description: "Download the latest prices and scan now (untick to only rebuild the site)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["app/**", "egx_agent/**", "site/**", "requirements.txt", ".github/workflows/site.yml"]

permissions:
  contents: write     # the keep-alive commit
  pages: write
  id-token: write
  actions: write      # tidying old copies of the data

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: "latest" moves to a new Ubuntu by itself, which could break a run overnight
    timeout-minutes: 60
    outputs:
      publish: ${{ steps.scan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Bring back the data from the last run
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Install
        run: pip install -r requirements.txt

      - name: If the data is gone, bring back the latest backup
        if: steps.restore.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          EGX_SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          mkdir -p _restore
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=state-backup&per_page=10" \
                        --jq '.artifacts | map(select(.expired | not)) | sort_by(.created_at) | reverse | .[].id'); do
            rm -f _restore/*
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > _restore/backup.zip \
              && unzip -o -q _restore/backup.zip -d _restore \
              && python -m app.backup restore --file _restore/state.egxb --db state/egx.db && break
          done
          rm -rf _restore
          [ -f state/egx.db ] || echo "No backup to bring back: starting fresh."

      - id: pages
        uses: actions/configure-pages@v6

      - name: Scan and build the site
        id: scan
        env:
          EGX_SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_TELEGRAM: ${{ secrets.OWNER_TELEGRAM }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          FORCE_SCAN: ${{ inputs.force_scan }}
          TZ: Africa/Cairo
        run: >-
          python -m app.site_daily --db state/egx.db --config site/strategy.yaml --out _site
          --backup _backup/state.egxb

      - name: Tell the owner on Telegram that this run failed
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TZ: Africa/Cairo
        run: python3 -m app.health crashed --db state/egx.db

      - name: Keep the data for the next run
        if: always() && hashFiles('state/egx.db') != ''
        uses: actions/cache/save@v6
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Back up the data (about once a day)
        if: success() && hashFiles('_backup/state.egxb') != ''
        uses: actions/upload-artifact@v7
        with:
          name: state-backup
          path: _backup/state.egxb
          retention-days: 30
          compression-level: 0

      - name: Remove older copies of the data
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key state- --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' \
            | xargs -r -n1 gh cache delete || true

      - uses: actions/upload-pages-artifact@v5
        if: steps.scan.outputs.publish == 'true'
        with:
          path: _site

      - name: Keep the schedule alive
        # GitHub pauses scheduled jobs in a repository with no commits for 60 days.
        run: |
          if [ $(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%F > .github/keepalive
            git add .github/keepalive
            git commit -m "Keep the daily scan running"
            git push
          fi

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
